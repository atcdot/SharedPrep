services:
  api:
    image: ghcr.io/${GITHUB_REPO:-atcdot/sharedprep}:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "8080"
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sharedprep.rule=Host(`${HOST:-sharedprep.example.com}`)"
      - "traefik.http.routers.sharedprep.entryPoints=websecure"
      - "traefik.http.routers.sharedprep.tls=true"
      - "traefik.http.routers.sharedprep.tls.certResolver=letsencrypt"
      - "traefik.http.services.sharedprep.loadbalancer.server.port=8080"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
